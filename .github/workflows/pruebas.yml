name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instala dependencias
        run: |
          python -m pip install \
            sympy==1.14.0 \
            numpy==2.5.4 \
            httpx==0.28.1 \
            pynacl==1.6.2 \
            psutil==7.2.2 \
            networkx==3.7 \
            pytest==9.1.1
      - name: Ejecuta pruebas
        run: python -m pytest -q
